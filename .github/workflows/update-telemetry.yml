- name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/metrics.json data/projects.json assets/ docs/

          # Si el único cambio en data/metrics.json es "generated_at", lo descartamos
          # para no generar commits vacíos de contenido cuando no hubo cambios reales.
          if git diff --cached --quiet -- ':!data/metrics.json'; then
            if git diff --cached -- data/metrics.json | grep -E '^[+-]\s*"generated_at"' >/dev/null && \
               ! git diff --cached -- data/metrics.json | grep -E '^[+-]' | grep -vE '^(---|\+\+\+|[+-]\s*"generated_at")' >/dev/null; then
              git checkout HEAD -- data/metrics.json
            fi
          fi

          if git diff --cached --quiet; then
            echo "[INFO] No hay cambios reales que publicar."
            exit 0
          fi

          git commit -m "chore(telemetry): update profile SVGs and projects catalog"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "[OK] Cambios publicados en main."
              exit 0
            fi

            echo "[WARN] Push rechazado (intento $attempt/3). Sincronizando con origin/main..."
            if ! git pull --rebase origin main; then
              echo "[WARN] Conflicto al hacer rebase en archivos generados; aplicando versión local generada."
              git checkout --ours -- data/metrics.json data/projects.json assets/ docs/ 2>/dev/null || true
              git add -- data/metrics.json data/projects.json assets/ docs/
              git rebase --continue || {
                git rebase --abort
                echo "[ERROR] No se pudo completar el rebase automáticamente."
                exit 1
              }
            fi
          done

          echo "[ERROR] Falló el push tras 3 intentos."
          exit 1
