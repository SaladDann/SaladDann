    e=#A2D2FF, l=#90E0EF,  =#E2ECE9, s=#B7E4C7, e=#A2D2FF, r=#FFB5A7,  =#E2ECE9,
    c=#CDB4DB, o=#FFC8DD, m=#FFF3B0, o=#FFC8DD,  =#E2ECE9,
    a=#FBC4AB, r=#FFB5A7, t=#8ECAE6, e=#A2D2FF,  =#E2ECE9,
    y=#E0AAFF,  =#E2ECE9,
    a=#FBC4AB, r=#FFB5A7, t=#8ECAE6, e=#A2D2FF,  =#E2ECE9,
    c=#CDB4DB, o=#FFC8DD, m=#FFF3B0, o=#FFC8DD,  =#E2ECE9,
    v=#BDB2FF, i=#9BF6FF, d=#CAFFBF, a=#FBC4AB
